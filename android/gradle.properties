org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# KSP still registers its generated sources through the kotlin.sourceSets DSL, which AGP 9
# disallows by default. Until KSP moves to android.sourceSets this flag is what lets Room
# and Hilt's processors run at all.
android.disallowKotlinSourceSets=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

kotlin.code.style=official
